<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krispy Kreme · Pune</title>
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Krispy Kreme <span class="dot">·</span> Pune</h1>
      <p id="generated-at"></p>
    </div>

    <div class="kpis" id="kpis"></div>

    <section class="category-filter">
      <button data-category="All" class="active">All · 13 stores</button>
      <button data-category="Cfi">Cfi · 5</button>
      <button data-category="Rebel">Rebel · 4</button>
      <button data-category="Offline">Offline · 4</button>
    </section>

    <section id="alerts">
      <h2>🚨 What's not working</h2>
      <ul id="alerts-list"></ul>
    </section>

    <section id="revenue">
      <h2>💰 Revenue by store</h2>
      <div class="store-grid" id="store-grid"></div>
    </section>

    <section id="ops">
      <h2>📊 Storefront ops &amp; ratings</h2>
      <div class="ops-grid" id="ops-grid"></div>
    </section>
  </div>

  <script src="assets/alerts.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
