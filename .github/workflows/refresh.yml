name: Daily data refresh

on:
  schedule:
    # 18:45 UTC = 00:15 IST (Asia/Kolkata is UTC+5:30, no DST)
    - cron: "45 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dashboard data
        env:
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: python3 -m build.build_data

      - name: Commit and push data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit."
            exit 0
          fi
          git commit -m "Daily data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
